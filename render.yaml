services:
  - type: web
    name: pulsequeue
    runtime: node
    plan: free
    buildCommand: rm -f package-lock.json web/package-lock.json server/package-lock.json && npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: WORKERS
        value: "4"
